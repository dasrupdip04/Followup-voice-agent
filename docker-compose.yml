services:
  postgres:
    image: postgres:16
    container_name: followup-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: followup
      POSTGRES_USER: followup_user
      POSTGRES_PASSWORD: followup_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: